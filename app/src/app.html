<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ffffff" />
		<meta name="color-scheme" content="light" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Tasks" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<script>
			// The black theme before the first paint, without a white flash (13 Nov 2026).
			try {
				var a = JSON.parse(localStorage.getItem('appearance_v1') || '{}');
				var dark = a.theme === 'black' || (a.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
				if (dark) document.documentElement.dataset.theme = 'black';
				if (a.mono) document.documentElement.dataset.mono = '1';
			} catch (e) {}
		</script>
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<title>Tasks</title>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
